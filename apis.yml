name: OpenIO
description: >-
  OpenIO SDS is an open-source, software-defined object storage platform for
  building hyper-scalable, high-performance storage infrastructures. It stores
  data across commodity hardware and exposes it through an Amazon S3-compatible
  gateway and an OpenStack Swift-compatible gateway, backed by native RAWX,
  Conscience, Directory, Container, Content and Account services. Developers
  integrate via first-party Python, C and Java client libraries and the `openio`
  command-line interface, or with any standard AWS S3 / Swift SDK and CLI. The
  S3 gateway supports Signature v2/v4, versioning, lifecycle, CORS, tagging,
  ACLs and multipart uploads, plus a documented subset of AWS IAM (paid plans).
  OpenIO was founded as a French storage company backed by Partech and acquired
  by OVHcloud in 2020; the SDS project remains publicly documented open source.
